name: Sketcher Build and Test

on:
  workflow_dispatch: ~
  pull_request: ~
  merge_group: ~
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        type: string
        default: ${{ github.ref }}
      publish-npm-package:
        description: Whether an npm package should be published with the wasm build artifacts
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    outputs:
      source-matrix: ${{ steps.source-metadata.outputs.source-matrix }}
      source-artifact-prefix: ${{ steps.source-metadata.outputs.source-artifact-prefix }}
      source-ref: ${{ steps.source-metadata.outputs.source-ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install pre-commit
        run: python3 -m pip install pre-commit==1.7.0 clang-format==14.0.6 yapf==0.40.2 cmake-format==0.6.13 pytest==9.0.2 cmake==3.31.10 ninja==1.13.0

      - name: Code formatting check
        run: pre-commit run --all-files

      - name: Test GitHub Actions helpers
        run: pytest test/github_actions/

      - name: Generate dependency source metadata
        id: source-metadata
        run: |
          cmake -S external -B build/source-metadata -G Ninja \
              -DSKETCHER_EXTERNAL_SOURCES_ONLY=ON
          python3 external/source_cache.py outputs \
              --manifest build/source-metadata/source-manifest.json \
              --cache-dir build/source-cache >> "$GITHUB_OUTPUT"

  prepare-external-sources:
    needs: pre-commit
    runs-on: ubuntu-latest
    # Sources are an optimization. A preparation failure must not prevent a
    # builder from using its existing installed-library cache.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.pre-commit.outputs.source-matrix) }}
    steps:
      - name: Check source cache
        id: source-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ matrix.key }}
          enableCrossOsArchive: true
          lookup-only: true

      - uses: actions/checkout@v6
        if: steps.source-cache.outputs.cache-hit != 'true'
        with:
          ref: ${{ needs.pre-commit.outputs.source-ref }}

      - name: Install source download tools
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: python3 -m pip install cmake==3.31.10 ninja==1.13.0

      - name: Fetch pristine dependency sources
        if: steps.source-cache.outputs.cache-hit != 'true'
        env:
          LIBRARY: ${{ matrix.library }}
        run: |
          cmake -S external -B build/source-metadata -G Ninja \
              -DSKETCHER_EXTERNAL_SOURCES_ONLY=ON
          python3 external/source_cache.py fetch \
              --manifest build/source-metadata/source-manifest.json \
              --cache-dir build/source-cache --library "$LIBRARY"

      - name: Save dependency sources
        if: steps.source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ matrix.key }}
          enableCrossOsArchive: true

      # Artifacts also cover cache publication failures and branch-scope limits.
      - name: Share newly fetched sources with all builders
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.pre-commit.outputs.source-artifact-prefix }}-${{ matrix.key }}
          path: ${{ matrix.cache-path }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build-test:
    needs: [pre-commit, prepare-external-sources]
    if: ${{ !cancelled() && needs.pre-commit.result == 'success' }}
    name: build-test (${{ matrix.build-name }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      EXTERNAL_SOURCE_ARTIFACT_PREFIX: ${{ needs.pre-commit.outputs.source-artifact-prefix }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-name: macos-15-arm64
            runner: macos-15
          - build-name: macos-26-arm64
            runner: macos-26
          - build-name: windows-x64
            runner: windows-2025
          - build-name: linux-x64
            runner: ubuntu-24.04
          - build-name: wasm
            runner: ubuntu-24.04
          - build-name: memtest
            runner: ubuntu-24.04
    steps:
      # the memtest runner may run out of space if it has to build the
      # dependencies, so erase stuff that we know we don't need
      - name: Free up space on runner
        if: matrix.build-name == 'memtest'
        run: |
          echo "Free space before cleanup = $(df -h / | awk 'NR==2 {print $4}')"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "Free space after cleanup = $(df -h / | awk 'NR==2 {print $4}')"

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pre-commit.outputs.source-ref }}

      - name: Create and activate virtualenv
        if: startsWith(matrix.build-name, 'macos')
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV

      - name: Install Python packages
        run: python3 -m pip install cmake==3.31.10 ninja==1.13.0 pytest pytest-cpp pytest-xdist

      - name: Install valgrind
        if: matrix.build-name == 'memtest'
        run: sudo apt-get update && sudo apt-get install valgrind

      - name: Determine build type
        run: echo BUILD_TYPE=${{ matrix.build-name == 'memtest' && 'Debug' || 'Release' }} >> "$GITHUB_ENV"

      - name: Read external/versions.json
        run: |
          {
              echo 'VERSIONS_JSON<<EOF'
              cat external/versions.json
              echo -e '\nEOF'
          } >> "$GITHUB_ENV"

      - name: Fetch emscripten
        if: matrix.build-name == 'wasm'
        uses: ./.github/actions/activate-emsdk
        with:
          version: ${{ fromJson(env.VERSIONS_JSON).emscripten }}

      - name: Add emscripten to PATH
        if: matrix.build-name == 'wasm'
        env:
          VERSION: ${{ fromJson(env.VERSIONS_JSON).emscripten }}
        run: |
          echo "${{ github.workspace }}/build/external/emsdk-${{ env.VERSION }}/emsdk/" >> $GITHUB_PATH && \
          echo "${{ github.workspace }}/build/external/emsdk-${{ env.VERSION }}/emsdk/upstream/emscripten" >> $GITHUB_PATH

      - name: Activate MSVC
        if: matrix.build-name == 'windows-x64'
        uses: ./.github/actions/activate-msvc

      - name: Configure Dependency CMake
        run: |
          ${{ matrix.build-name == 'wasm' && 'emcmake ' || '' }}\
              cmake -B build/external/ -S external/ -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DSKETCHER_EXTERNAL_SOURCE_CACHE="$GITHUB_WORKSPACE/build/source-cache"

      - name: Configure host Qt CMake
        if: matrix.build-name == 'wasm'
        run: |
          cmake -B build/external/host/ -S external/ -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DQT_HOST_BUILD=ON \
              -DSKETCHER_EXTERNAL_SOURCE_CACHE="$GITHUB_WORKSPACE/build/source-cache"

      - name: Fetch fmt
        id: fetch-fmt
        uses: ./.github/actions/build-external
        with:
          library: fmt
          version: ${{ fromJson(env.VERSIONS_JSON).fmt }}

      - name: Fetch expat
        id: fetch-expat
        uses: ./.github/actions/build-external
        with:
          library: expat
          version: ${{ fromJson(env.VERSIONS_JSON).expat }}

      - name: Fetch zlib
        id: fetch-zlib
        uses: ./.github/actions/build-external
        with:
          library: zlib
          version: ${{ fromJson(env.VERSIONS_JSON).zlib }}

      - name: Fetch zstd
        id: fetch-zstd
        uses: ./.github/actions/build-external
        with:
          library: zstd
          version: ${{ fromJson(env.VERSIONS_JSON).zstd }}

      - name: Fetch Boost
        id: fetch-boost
        uses: ./.github/actions/build-external
        with:
          library: boost
          version: ${{ fromJson(env.VERSIONS_JSON).boost }}

      - name: Fetch Eigen
        id: fetch-eigen
        uses: ./.github/actions/build-external
        with:
          library: eigen
          version: ${{ fromJson(env.VERSIONS_JSON).eigen }}

      - name: Fetch SQLite3
        id: fetch-sqlite
        uses: ./.github/actions/build-external
        with:
          library: sqlite
          version: ${{ fromJson(env.VERSIONS_JSON).sqlite }}

      - name: Fetch RDKit
        id: fetch-rdkit
        uses: ./.github/actions/build-external
        with:
          library: rdkit
          version: ${{ fromJson(env.VERSIONS_JSON).rdkit }}

      - name: Install Qt's required packages
        if: ${{ !startsWith(matrix.build-name, 'macos') && matrix.build-name != 'windows-x64' }}
        run: |
          sudo apt-get update && sudo apt-get install \
            libfontconfig1-dev \
            libfreetype-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-util-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb1-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrender-dev

      - name: Fetch host Qt
        if: matrix.build-name == 'wasm'
        uses: ./.github/actions/build-external
        with:
          library: qt
          version: ${{ fromJson(env.VERSIONS_JSON).qt }}
          host-build: true

      - name: Fetch Qt
        id: fetch-qt
        uses: ./.github/actions/build-external
        with:
          library: qt
          version: ${{ fromJson(env.VERSIONS_JSON).qt }}

      - name: Configure CMake
        env:
          CMAKE_PREFIX_PATH: "${{ steps.fetch-expat.outputs.path }};\
            ${{ steps.fetch-fmt.outputs.path }};\
            ${{ steps.fetch-zlib.outputs.path }};\
            ${{ steps.fetch-zstd.outputs.path }};\
            ${{ steps.fetch-boost.outputs.path }};\
            ${{ steps.fetch-eigen.outputs.path }};\
            ${{ steps.fetch-rdkit.outputs.path }};\
            ${{ steps.fetch-sqlite.outputs.path }};\
            ${{ steps.fetch-qt.outputs.path }}"
        # For the WASM build, we need to invoke both the emscripten environment
        # and Qt's CMake wrapper
        run: |
          ${{ matrix.build-name == 'wasm' && 'source emsdk_env.sh && ' || '' }}\
          ${{ matrix.build-name == 'wasm' && format('"{0}/bin/qt-cmake"', steps.fetch-qt.outputs.path) || 'cmake' }} \
                -B build -S . -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON \
                -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}" \
                ${{ matrix.build-name == 'wasm' && '-DENABLE_TESTING=OFF' || '' }}

      - name: Build
        id: sketcher-build
        run: cmake --build build --verbose --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        working-directory: build
        if: matrix.build-name != 'wasm' && matrix.build-name != 'memtest'
        env:
          SKETCHER_SOURCE_DIR: ${{ github.workspace }}
        # Launching `xvfb-run -a` required for Ubuntu
        run: |
          ${{ matrix.build-name == 'linux-x64' && 'xvfb-run -a' || ''}} \
          pytest -n auto --ignore=external

      - name: Run wasm tests
        if: matrix.build-name == 'wasm'
        run: |
          cd test/wasm
          npm install
          npm run test

      - name: Run memtests
        working-directory: build
        if: matrix.build-name == 'memtest'
        # Using -j4 instead of -j because cmake 3.24 requires a specific number.
        # xvfb-run is embedded in each memtest command in CMakeLists so each
        # test gets its own isolated X display rather than sharing one.
        run: |
          ctest -j4 --build-config ${{ env.BUILD_TYPE }} -L memtest --output-on-failure

      - name: Upload artifact
        if: always() && steps.sketcher-build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: sketcher-${{ inputs.ref || github.sha }}-${{ matrix.build-name }}
          path: |
            build/sketcher_app
            !build/sketcher_app/*.manifest

      - name: Publish sketcher npm package
        if: matrix.build-name == 'wasm' && inputs.publish-npm-package
        uses: ./.github/actions/publish-npm-package
