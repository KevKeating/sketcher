name: Update Wasm Snapshots

# Downloads the wasm artifact from a previous "Sketcher Build and Test" run,
# regenerates the playwright snapshots (i.e. screen shots) against it, and
# uploads the new snapshots as a downloadable artifact. This action is needed
# when a commit is expected to change the appearance of the Sketcher.
#
# Trigger this from the Actions tab. Provide the run ID of a sketcher-builder
# run that contains the wasm artifact (the numeric ID at the end of the run
# URL). The wasm artifact is uploaded whenever the C++ build succeeds, even
# if the wasm playwright tests fail — which is exactly when snapshots need
# regenerating.
#
# The run fails if any test fails for a reason other than a screenshot
# difference.  The failures are annotated on the run's summary page.

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Sketcher Build and Test run ID containing the wasm artifact'
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  update-snapshots:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Look up commit SHA for build run
        id: lookup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.run-id }} --jq '.head_sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.lookup.outputs.sha }}

      - name: Download wasm artifact from build run
        uses: actions/download-artifact@v6
        with:
          pattern: 'sketcher-*-wasm'
          path: build/sketcher_app/
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run-id }}

      - name: Install playwright
        working-directory: test/wasm
        run: npm install

      - name: Run playwright with --update-snapshots=all
        id: regenerate
        working-directory: test/wasm
        env:
          # Start from no e2e snapshots, so that snapshots no test takes
          # anymore are left out of the regenerated set.
          SKETCHER_REGENERATE_SNAPSHOTS: '1'
        # "all" rewrites every snapshot that differs at all.  The default,
        # "changed", only rewrites snapshots that fail the comparison tolerance,
        # so smaller appearance changes would never be recorded.  It also means
        # that any test that still fails failed for some other reason.  The
        # github reporter annotates those failures on the run's summary page.
        run: npm run test -- --update-snapshots=all --reporter=list,github

      - name: Report test failures
        if: failure() && steps.regenerate.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Some tests failed for reasons other than screenshot differences

          Every screenshot difference was written to the new snapshots, so the
          failures annotated on this page are other problems, such as a failed
          assertion, a timeout, or a screenshot that never became stable.

          A test that failed may have stopped before taking all of its
          screenshots, and the snapshots it didn't take are missing from the
          artifact.  Repacking its snapshots would delete them from its archive.
          EOF

      - name: Upload regenerated snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wasm-snapshots-${{ github.run_id }}
          path: |
            test/wasm/__snapshots__/
            test/wasm/e2e/__snapshots__/
          if-no-files-found: error
