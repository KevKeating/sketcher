name: 'activate-msvc'
description: >
  Activates the MSVC compiler. Also installs and activates the Intel Fortran
  compiler, since gfortran doesn't work with MSVC. This action should only be
  run on Windows runners.

# this action doesn't need any permissions for reading from or writing to the
# repository itself
permissions:
  contents: none

runs:
  using: 'composite'
  steps:
    - name: Determine Fortran cache settings
      id: fortran-vars
      shell: bash
      run: |
        echo 'version=2025.2' >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
        echo 'ONEAPI_ROOT=C:\Program Files (x86)\Intel\oneAPI' >> "$GITHUB_ENV"

    # setup-fortran rotates its own cache daily. Only call it when our stable
    # cache is missing, and activate the restored installation ourselves.
    - name: Restore Fortran
      id: fortran-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.ONEAPI_ROOT }}
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.fortran-vars.outputs.image }}-intel-${{ steps.fortran-vars.outputs.version }}-v1

    - name: Install Fortran
      if: steps.fortran-cache.outputs.cache-hit != 'true'
      uses: fortran-lang/setup-fortran@v1.9.0
      with:
        compiler: 'intel'
        version: ${{ steps.fortran-vars.outputs.version }}
        update-environment: false

    # Save immediately so a later build failure doesn't discard the installation.
    - name: Save Fortran
      if: steps.fortran-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.ONEAPI_ROOT }}
        key: ${{ steps.fortran-cache.outputs.cache-primary-key }}

    - name: Activate cached oneAPI
      if: steps.fortran-cache.outputs.cache-hit == 'true'
      shell: cmd
      run: |
        call "%ONEAPI_ROOT%\setvars.bat"
        if errorlevel 1 exit /b 1
        set | findstr /c:"oneAPI" >> "%GITHUB_ENV%"
        >> "%GITHUB_ENV%" echo SETVARS_COMPLETED=1

    # Only set the Fortran compiler; the C and C++ compilers must remain MSVC.
    # setup-fortran already hides the GNU linker on cache misses.
    - name: Activate Fortran
      shell: bash
      run: |
        if [[ "${{ steps.fortran-cache.outputs.cache-hit }}" == 'true' ]]; then
            mv /usr/bin/link "$RUNNER_TEMP/link"
        fi
        echo FC=ifx >> "$GITHUB_ENV"

      # Find MSVC using vswhere.exe, then use vcvarsall.bat to output the
      # appropriate environment variable updates and put them into $GITHUB_ENV
    - name: Activate MSVC
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

        $installPath = & $vswhere -latest -property installationPath
        if (-not $installPath) { throw "vswhere did not find a Visual Studio installation" }

        $vcvarsall = Join-Path $installPath 'VC\Auxiliary\Build\vcvarsall.bat'
        if (-not (Test-Path $vcvarsall)) { throw "vcvarsall.bat not found at $vcvarsall" }

        $envBefore = New-Object 'System.Collections.Generic.Dictionary[String,String]' ([StringComparer]::OrdinalIgnoreCase)
        Get-ChildItem env: | ForEach-Object { $envBefore[$_.Name] = $_.Value }

        $output = cmd /c "`"$vcvarsall`" x64 > nul && set"
        if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat failed with exit code $LASTEXITCODE" }

        foreach ($line in $output) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name = $matches[1]
            $value = $matches[2]

            # Skip variables that contain a multi-line value (e.g. VERSIONS_JSON) 
            # since vcvarsall.bat shouldn't modify them
            if ($envBefore.ContainsKey($name) -and $envBefore[$name].Contains("`n")) {
                continue
            }

            if (-not $envBefore.ContainsKey($name) -or $envBefore[$name] -ne $value) {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
            }
        }
