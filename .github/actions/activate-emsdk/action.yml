name: 'setup-emscripten'
description: 'Builds emscripten library'

inputs:
  version:
    description: 'Version emscripten to download and activate'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6
      if: ${{ steps.cache-check.outputs.cache-hit != 'true' }}
      with:
        repository: emscripten-core/emsdk
        ref: ${{ inputs.version }}
        path: build/external/emsdk-${{ inputs.version }}/emsdk/

    - name: Install and activate emscripten
      shell: bash
      run: |
        cd build/external/emsdk-${{ inputs.version }}/emsdk/ && \
        ./emsdk install ${{ inputs.version }} && \
        ./emsdk activate ${{ inputs.version }}

    # Re-evaluate this workaround when upgrading Emscripten. The final Stack IR
    # optimization exhausts the runner's RAM and swap after Asyncify completes.
    - name: Disable final Stack IR optimization
      if: inputs.version == '5.0.5'
      shell: bash
      run: |
        patch --batch --forward --fuzz=0 -p1 \
          --directory="build/external/emsdk-${{ inputs.version }}/emsdk/upstream/emscripten" \
          --input="$GITHUB_ACTION_PATH/disable_final_stack_ir.patch"
